name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels its previous run; master runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported GitHub-hosted image per platform.
        os: [ubuntu-22.04, ubuntu-26.04, macos-15, macos-26, windows-2022, windows-2025]
        python-version: ["3.10", "3.14"]
        # GitHub runs few macOS jobs at a time, so each macOS image tests one
        # Python: the oldest image the oldest Python, the newest the newest.
        exclude:
          - os: macos-15
            python-version: "3.14"
          - os: macos-26
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: pytest --analysis

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install '.[test,docs]' build twine
      - run: mypy s7commplus
      - run: ruff check s7commplus tests
      - run: ruff format --check s7commplus tests
      - name: Verify SessionKey artifact and evidence provenance
        run: python -m tools.verify_v1_session_key
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - run: twine check dist/*
      - name: Verify wheel contents
        run: >-
          python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist();
          required = ('s7commplus/py.typed', 's7commplus/v1_session_key/LICENSE-HarpoS7', 's7commplus/v1_session_key/ARCHITECTURE.md');
          assert all(item in names for item in required);
          assert any(item.startswith('s7commplus/zlib_dicts/') and item.endswith('.xml') for item in names)"
