name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: pytest
      - run: ruff check s7commplus tests
      - run: ruff format --check s7commplus tests

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install '.[test,docs]' build twine
      - run: mypy s7commplus
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - run: twine check dist/*
      - name: Verify wheel contents
        run: >-
          python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist();
          required = ('s7commplus/py.typed', 's7commplus/session_auth/LICENSE-HarpoS7');
          assert all(item in names for item in required); assert any(item.endswith('.bin') for item in names);
          assert any(item.startswith('s7commplus/zlib_dicts/') and item.endswith('.xml') for item in names)"
