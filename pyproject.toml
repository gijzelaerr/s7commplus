[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "s7commplus"
version = "0.1.0"
description = "Pure Python S7CommPlus client and server emulator for Siemens S7-1200/1500 PLCs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "s7commplus/session_auth/LICENSE-HarpoS7"]
authors = [{name = "Gijs Molenaar", email = "gijsmolenaar@gmail.com"}]
keywords = ["s7commplus", "s7", "siemens", "plc", "industrial-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-bdd>=8.1,<9", "pytest-cov", "hypothesis", "mypy", "ruff"]
docs = ["sphinx>=7.2", "furo>=2024.8.6"]
analysis = ["z3-solver>=4.13,<5"]

[project.urls]
Homepage = "https://github.com/gijzelaerr/s7commplus"
Repository = "https://github.com/gijzelaerr/s7commplus"
Issues = "https://github.com/gijzelaerr/s7commplus/issues"
Documentation = "https://s7commplus.readthedocs.io/"

[tool.setuptools.package-data]
s7commplus = [
    "py.typed",
    "session_auth/**/*.bin",
    "session_auth/ARCHITECTURE.md",
    "session_auth/MAINTAINER_GUIDE.md",
    "session_auth/MONOLITH5_ANALYSIS.md",
    "session_auth/MONOLITH7_ANALYSIS.md",
    "session_auth/MONOLITH11_ANALYSIS.md",
    "session_auth/TRANSFORM12_ANALYSIS.md",
    "session_auth/MODEL_BENCHMARKS.md",
    "session_auth/LICENSE-HarpoS7",
    "session_auth/artifacts.json",
    "zlib_dicts/*.xml",
]

[tool.setuptools.packages.find]
include = ["s7commplus*"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "conformance: protocol conformance tests",
    "e2e: end-to-end tests requiring a real PLC connection",
    "real_plc: versioned real-PLC acceptance scenario",
    "smoke: read-only real-PLC acceptance scenario",
    "write: real-PLC scenario that changes and restores scratch data",
    "plc_write: existing real-PLC test that modifies scratch data",
    "administrative: disruptive real-PLC scenario requiring separate opt-in",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
