[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "s7commplus"
version = "0.2.0"
description = "Pure Python S7CommPlus client and server emulator for Siemens S7-1200/1500 PLCs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "s7commplus/v1_session_key/LICENSE-HarpoS7"]
authors = [{name = "Gijs Molenaar", email = "gijsmolenaar@gmail.com"}]
keywords = ["s7commplus", "s7", "siemens", "plc", "industrial-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-bdd>=8.1,<9", "pytest-cov", "hypothesis", "mypy", "ruff"]
docs = ["sphinx>=7.2", "furo>=2024.8.6"]
analysis = ["z3-solver>=4.13,<5"]

[project.urls]
Homepage = "https://github.com/gijzelaerr/s7commplus"
Repository = "https://github.com/gijzelaerr/s7commplus"
Issues = "https://github.com/gijzelaerr/s7commplus/issues"
Documentation = "https://s7commplus.readthedocs.io/"

[tool.setuptools.package-data]
s7commplus = [
    "py.typed",
    "v1_session_key/**/*.bin",
    "v1_session_key/ARCHITECTURE.md",
    "v1_session_key/MAINTAINER_GUIDE.md",
    "v1_session_key/MODEL_BENCHMARKS.md",
    "v1_session_key/LICENSE-HarpoS7",
    "zlib_dicts/*.xml",
]

[tool.setuptools.packages.find]
include = ["s7commplus*"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "conformance: protocol conformance tests",
    "slow: re-derives a recovered SessionKey proof via Z3; skipped by default, pass --slow to run",
    "analysis: studies retired HarpoS7 code in old/; skipped by default, pass --analysis to run (CI does)",
    "e2e: end-to-end tests requiring a real PLC connection",
    "real_plc: versioned real-PLC acceptance scenario",
    "smoke: read-only real-PLC acceptance scenario",
    "write: real-PLC scenario that changes and restores scratch data",
    "plc_write: existing real-PLC test that modifies scratch data",
    "administrative: disruptive real-PLC scenario requiring separate opt-in",
    "symbolic: real-PLC scenario that browses or addresses tags by name",
    "subscription: real-PLC scenario using data change subscriptions",
    "alarm: real-PLC scenario using the alarm snapshot or alarm subscriptions",
    "cpu_state: real-PLC scenario reading the CPU operating state",
    "tls: real-PLC scenario that needs --plc-use-tls",
    "password: real-PLC scenario that needs the S7COMMPLUS_TEST_PASSWORD environment variable",
    "pending: real-PLC scenario for an API from an open pull request; skipped until it is merged",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
